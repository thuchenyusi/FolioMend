[package]
name = "foliomend"
version = "0.1.0"
description = "本地批量归一化、裁剪和压缩扫描 PDF 的桌面工具"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
lopdf = "0.34"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
