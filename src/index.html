<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FolioMend</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></div>
            <div>
                <h1>FolioMend</h1>
                <p class="description">让扫描文档整齐、轻巧、易于阅读。</p>
            </div>
            <span class="local-badge"><span aria-hidden="true"></span>本地处理</span>
        </header>

        <div class="file-section">
            <div class="file-controls">
                <button id="btn-select" class="btn btn-primary">选择 PDF 文件</button>
                <span class="hint">支持选择多个文件，也可直接拖拽文件到窗口</span>
            </div>

            <div class="file-input-row">
                <input type="text" id="manual-path" placeholder="或手动输入文件路径，按回车添加..." class="input-path">
                <button id="btn-add-path" class="btn btn-small">添加</button>
            </div>

            <div id="file-list" class="file-list">
                <p class="empty-hint">尚未选择任何文件</p>
            </div>
        </div>

        <section class="options-section" aria-labelledby="options-title">
            <div class="section-heading">
                <div>
                    <h2 id="options-title">处理选项</h2>
                    <p>按需调整，生成适合阅读的 PDF。</p>
                </div>
                <span class="section-caption">4 类设置</span>
            </div>

            <div class="options-grid">
                <section class="option-category category-pages" aria-labelledby="pages-title">
                    <div class="category-heading">
                        <span class="category-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>
                        <div><h3 id="pages-title">页面与尺寸</h3><p>统一显示宽度，调整可见区域</p></div>
                    </div>
                    <label class="check-option">
                        <span><strong>统一页面宽度</strong><small>按可见区域等比缩放，让不同页面保持一致的阅读宽度</small></span>
                        <input id="option-normalize-pages" type="checkbox" role="switch" checked>
                    </label>
                    <div class="page-settings">
                        <div class="width-options">
                            <div class="select-option">
                                <label for="width-mode">目标宽度</label>
                                <div id="width-controls" class="width-controls">
                                    <select id="width-mode" aria-describedby="width-mode-hint">
                                        <option value="auto">自动识别</option>
                                        <option value="userDefined">自定义</option>
                                    </select>
                                    <label id="custom-width-row" class="custom-width-control initially-hidden" for="custom-width">
                                        <span class="sr-only">自定义宽度（pt）</span>
                                        <input id="custom-width" type="number" min="0" step="any" placeholder="例如 595.28" title="单位 pt；72 pt = 1 英寸，A4 短边约 595.28 pt" aria-describedby="width-mode-hint" disabled>
                                        <span class="input-unit" aria-hidden="true">pt</span>
                                    </label>
                                </div>
                            </div>
                            <p id="width-mode-hint" class="option-hint"></p>
                        </div>
                        <div class="crop-options">
                            <label class="select-option" for="crop-mode">
                                <span>页面裁剪</span>
                                <select id="crop-mode" aria-describedby="crop-mode-hint">
                                    <option value="alignVisible">保留原始页面边界</option>
                                    <option value="trueCrop">裁剪到可见区域</option>
                                </select>
                            </label>
                            <p id="crop-mode-hint" class="option-hint"></p>
                        </div>
                    </div>
                </section>

                <section class="option-category category-images" aria-labelledby="images-title">
                    <div class="category-heading">
                        <span class="category-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m21 16-5-5-7 9M3 16l4-4 4 4"/></svg></span>
                        <div><h3 id="images-title">图像优化</h3><p>减小体积，保留扫描内容</p></div>
                    </div>
                    <label class="check-option">
                        <span><strong>压缩扫描图像</strong><small>自动识别彩色、灰度和黑白，选择合适的压缩方式</small></span>
                        <input id="option-compress-images" type="checkbox" role="switch" checked>
                    </label>
                </section>

                <section class="option-category category-repair" aria-labelledby="repair-title">
                    <div class="category-heading">
                        <span class="category-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6l-8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></span>
                        <div><h3 id="repair-title">文档修复</h3><p>处理无法正常读取的 PDF</p></div>
                    </div>
                    <label class="check-option">
                        <span><strong>自动修复 PDF 索引</strong><small>读取失败时尝试修复，成功后另存为新的 PDF</small></span>
                        <input id="option-repair-pdf" type="checkbox" role="switch" checked>
                    </label>
                </section>

                <section class="option-category category-bookmarks" aria-labelledby="bookmarks-title">
                    <div class="category-heading">
                        <span class="category-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17l-6-4-6 4V4Z"/></svg></span>
                        <div><h3 id="bookmarks-title">书签与导航</h3><p>保留目录结构，优化跳转体验</p></div>
                    </div>
                    <div class="bookmark-options">
                        <label class="check-option">
                            <span><strong>检测与修复异常书签</strong><small>优先保留并修复结构；如需清理现有书签，会先确认</small></span>
                            <input id="option-repair-bookmarks" type="checkbox" role="switch" checked>
                        </label>
                        <label class="check-option">
                            <span><strong>跳转时适合页面宽度</strong><small>保留标题、层级与纵向位置，外部链接不受影响</small></span>
                            <input id="option-fit-bookmarks" type="checkbox" role="switch">
                        </label>
                    </div>
                </section>
            </div>
        </section>

        <div id="progress-section" class="progress-section initially-hidden">
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <p id="progress-text" class="progress-text">处理中...</p>
        </div>

        <section id="results-section" class="results-section initially-hidden" aria-labelledby="results-title">
            <div class="results-heading">
                <h2 id="results-title">处理结果</h2>
                <div id="results-controls" class="results-controls" hidden>
                    <button id="btn-results-expand-all" class="btn btn-small" aria-controls="results-overview">全部展开</button>
                    <button id="btn-results-collapse-all" class="btn btn-secondary" aria-controls="results-overview">全部收起</button>
                </div>
            </div>
            <details id="results-overview" class="results-overview">
                <summary class="results-overview-summary">
                    <span id="results-summary" class="results-count">暂无处理结果</span>
                    <span class="results-fold-label">
                        <span class="fold-closed">展开文件列表</span>
                        <span class="fold-open">收起文件列表</span>
                    </span>
                </summary>
                <div id="results-list" class="results-list"></div>
            </details>
        </section>
    </div>

    <footer class="action-section">
        <div class="action-inner">
            <p class="output-note">输出至原文件目录<span>另存副本，保留原文件</span></p>
            <div class="action-buttons">
                <button id="btn-clear" class="btn btn-secondary">清空列表</button>
                <button id="btn-process" class="btn btn-success" disabled>开始处理 <span aria-hidden="true">→</span></button>
            </div>
        </div>
    </footer>

    <div id="drop-overlay" class="drop-overlay initially-hidden">
        <div class="drop-message">松开以添加 PDF 文件</div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
